[package]
name = "gaussflow-py"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
name = "gaussflow_py"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
pyo3-asyncio = { version = "0.20", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
anyhow = "1"
gaussflow-core = { path = "../gaussflow-core" }
gaussflow-runtime = { path = "../gaussflow-runtime" }
