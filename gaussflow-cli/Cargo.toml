[package]
name = "gaussflow-cli"
version = "0.0.1"
edition = "2021"

[dependencies]
# Core CLI and parsing
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
jsonwebtoken = "8"

# Performance monitoring and metrics
prometheus = "0.13"
lazy_static = "1.4"
metrics = "0.21"
metrics-exporter-prometheus = "0.12"
sysinfo = "0.29"

# Web framework and async
warp = "0.3"
tokio = { version = "1", features = ["full", "rt-multi-thread", "macros"] }

# Configuration and environment
dirs = "5"
config = "0.13"
dotenv = "0.15"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"

# Database
surrealdb = { version = "1.5.6", features = ["protocol-http", "protocol-ws"] }

# Advanced data structures and algorithms
dashmap = "5.5"
crossbeam-channel = "0.5"
rayon = "1.8"
parking_lot = "0.12"
indexmap = "2.0"

# Caching and performance
moka = { version = "0.12", features = ["sync"] }
lru = "0.12"

# HTTP client and networking
reqwest = { version = "0.11", features = ["json", "stream"] }
hyper = { version = "1", features = ["full"] }

# Time and date handling
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"

# File system and I/O
walkdir = "2.4"
glob = "0.3"
notify = "6.1"

# Compression and serialization
bincode = "1.3"
flate2 = "1.0"

# Security and cryptography
ring = "0.17"
base64 = "0.21"

# Progress bars and UI
indicatif = "0.17"
console = "0.15"
atty = "0.2"
term_size = "0.3"
rand = "0.8"

# Additional dependencies
num_cpus = "1.16"
petgraph = "0.6"

# Internal crates
gaussflow-core = { path = "../gaussflow-core" }
gaussflow-runtime = { path = "../gaussflow-runtime" }
gaussflow-synth = { path = "../gaussflow-synth" }
