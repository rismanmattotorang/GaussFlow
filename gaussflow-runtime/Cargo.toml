[package]
name = "gaussflow-runtime"
version = "0.0.1"
edition = "2021"

[dependencies]
# Core async runtime
tokio = { version = "1.28", features = ["full", "tracing", "rt-multi-thread", "time", "sync", "signal"] }
tokio-util = { version = "0.7", features = ["compat", "codec", "rt"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }

# Error handling
anyhow = { version = "1.0", features = ["backtrace"] }
thiserror = "1.0"

# Data structures
petgraph = { version = "0.6", features = ["serde-1", "generate"] }
priority-queue = { version = "2.0", features = ["serde"] }

# Concurrency
crossbeam-deque = { version = "0.8", features = ["crossbeam-utils"] }
crossbeam-epoch = "0.9"

# Storage
surrealdb = { version = "1.5.6", features = ["protocol-http", "protocol-ws"], default-features = false }

# HTTP client
reqwest = { version = "0.11", features = ["json", "rustls-tls", "stream"] }
dashmap = { version = "5.5", features = ["raw-api"] }

# Utils
uuid = { version = "1.3", features = ["v4", "v7", "serde"] }
num_cpus = "1.16"

# Task batching and scheduling
smallvec = { version = "1.11", features = ["union"] }
slotmap = "1.0"

# Power management (Linux only)
#[cfg(target_os = "linux")]
#cpufreq = { version = "0.4", optional = true }

# System monitoring
sysinfo = { version = "0.35", default-features = true }

# Atomic operations
atomic-waker = "1.1"

# Observability — imported unconditionally by lib/handler/planner, so kept non-optional.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Optional observability backends — not yet wired into the compiled runtime (roadmap Phase 4).
tokio-console = { version = "0.1", optional = true }
opentelemetry = { version = "0.21", optional = true }
opentelemetry-otlp = { version = "0.11", features = ["tonic", "tls"], optional = true }
prometheus = { version = "0.13", optional = true }

# Core crate
gaussflow-core = { path = "../gaussflow-core" }

# Cross-platform process info: Linux uses procfs; other platforms need no extra deps.
# NOTE: target-specific tables MUST come after all [dependencies] entries — any dependency
# declared below a [target.'cfg(...)'.dependencies] header is silently scoped to that target
# only. A misplaced header here previously orphaned tracing + gaussflow-core on Linux builds.
[target.'cfg(target_os = "linux")'.dependencies]
procfs = { version = "0.14", default-features = false, features = ["chrono"] }

# Benchmarking dependencies
[dev-dependencies]
tokio-test = "0.4"
rstest = "0.18"
proptest = { version = "1.2", features = ["std"] }
proptest-derive = "0.4"
serial_test = "2.0"

# Benchmarking
[dev-dependencies.criterion]
version = "0.5"
features = ["html_reports"]

[dev-dependencies.pprof]
version = "0.12"
features = ["criterion", "flamegraph"]

[dev-dependencies.rand]
version = "0.8"
features = ["small_rng"]

[dev-dependencies.rand_distr]
version = "0.4"

# NOTE: the previous benches targeted the removed `runtime::runtime` parallel engine and were
# deleted in Phase 1. New benches against the canonical `execute` path are a future task.

[features]
default = []
# OpenTelemetry export (reserved for Phase 4 — not yet wired into the compiled runtime).
otel = ["dep:opentelemetry", "dep:opentelemetry-otlp", "dep:tokio-console"]
# Prometheus metrics endpoint. NOTE: the metrics_endpoint module also needs an HTTP server dep
# (axum); completing this is a Phase 4 task. The feature is declared so default builds are clean.
metrics = ["dep:prometheus"]
http = []
# Enables the quarantined legacy planner test (drifted API). Off by default so CI stays green.
legacy_tests = []
