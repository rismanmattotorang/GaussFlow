[package]
name = "gaussflow-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Modern Terminal UI for GaussFlow DAG Workflow Engine"

[dependencies]
# TUI framework
ratatui = { version = "0.28", features = ["all-widgets"] }
crossterm = { version = "0.28", features = ["event-stream"] }

# Async runtime
tokio = { version = "1", features = ["full", "rt-multi-thread", "macros"] }
futures = "0.3"
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging & tracing  
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Utility
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
unicode-width = "0.1"
textwrap = "0.16"

# Configuration
config = "0.13"
dirs = "5"

# HTTP client for API communication
reqwest = { version = "0.11", features = ["json"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }

# Error handling
anyhow = "1"
thiserror = "1"

# GaussFlow core
gaussflow-core = { path = "../gaussflow-core", version = "0.1.0" }
gaussflow-runtime = { path = "../gaussflow-runtime", version = "0.1.0" }

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Better panic handling
better-panic = "0.3"
color-eyre = "0.6"

[[bin]]
name = "gaussflow-tui"
path = "src/main.rs"
