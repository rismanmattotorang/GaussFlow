[package]
name = "gaussflow-synth"
version = "0.0.1"
edition = "2021"
description = "GaussFlow synthesis layer: compile a natural-language prompt into a validated, runnable workflow DAG."

[dependencies]
gaussflow-core = { path = "../gaussflow-core" }
gaussflow-runtime = { path = "../gaussflow-runtime" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
thiserror = "1.0"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.28", features = ["macros", "rt-multi-thread"] }
