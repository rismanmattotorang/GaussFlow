[package]
name = "gaussflow-web"
version = "0.0.1"
edition = "2021"
description = "Modern WebUI for GaussFlow DAG Workflow Engine"
authors = ["GaussFlow Team"]

[dependencies]
# Web framework
axum = { version = "0.7", features = ["ws", "macros"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "cors", "trace", "compression-gzip"] }

# Async runtime
tokio = { version = "1", features = ["full", "rt-multi-thread", "macros"] }
futures = "0.3"
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Utility
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "5.5"
parking_lot = "0.12"

# Configuration
config = "0.13"
dotenv = "0.15"

# HTTP client (for health checks etc)
reqwest = { version = "0.11", features = ["json"] }

# Error handling
anyhow = "1"
thiserror = "1"

# GaussFlow core
gaussflow-core = { path = "../gaussflow-core" }
gaussflow-runtime = { path = "../gaussflow-runtime" }

# Templating
askama = { version = "0.12", features = ["with-axum"] }
askama_axum = "0.4"

[[bin]]
name = "gaussflow-web"
path = "src/main.rs"
