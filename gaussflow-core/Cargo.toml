[package]
name = "gaussflow-core"
version = "0.0.1"
edition = "2021"

[dependencies]
# Core dependencies
petgraph = { version = "0.6", features = ["serde-1", "generate"] }
sha2 = "0.10"
ahash = "0.8.12"
futures = { version = "0.3", features = ["thread-pool", "alloc"] }
tokio = { version = "1.28", features = ["full", "rt", "rt-multi-thread", "macros", "sync", "time", "parking_lot", "tracing"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "preserve_order"] }
thiserror = "1.0"
async-trait = "0.1.56"
tokio-util = { version = "0.7", features = ["compat"] }
tokio-sync = { version = "0.1.8" }
rayon = "1.9"  # Parallel processing

# Additional core deps
derive_more = "0.99"
fixedbitset = "0.5"
indexmap = { version = "1.9", features = ["serde-1"] }
bincode = "1.3"  # For binary serialization in hash implementations
rustc-hash = "1.1.0"  # For hashing
ordered-float = "3.0"  # For working with floating point numbers in Hash collections

# Storage
surrealdb = { version = "1.0.0-beta.8", default-features = false, features = ["kv-mem"] }
rocksdb = { version = "0.21", optional = true, features = ["lz4"] }
skytable = { version = "0.8", default-features = false, optional = true }

# Resource Management

# Performance-critical dependencies
lasso = { version = "0.7.3", features = ["serialize"] }  # String interning
crossbeam-channel = "0.5"  # For task queue
dashmap = "5.5"  # Concurrent hash map implementation
priority-queue = { version = "2.0", features = ["serde"] }  # For sharded priority queues
crossbeam-epoch = "0.9"  # Lock-free memory reclamation
crossbeam-utils = "0.8"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tokio-console = { version = "0.1", optional = true }
opentelemetry = { version = "0.21" }
opentelemetry-otlp = { version = "0.11", features = ["tonic", "tls"] }
opentelemetry-prometheus = "0.14"
tracing-opentelemetry = "0.22"
prometheus = "0.13"

# Utils
uuid = { version = "1.3", features = ["v4", "serde", "v7"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
regex = { version = "1.9", features = ["perf"] }
url = { version = "2.3", features = ["serde"] }

# Optional dependencies
lazy_static = { version = "1.4", features = ["spin_no_std"] }
semver = { version = "1.0", features = ["serde"] }
serde_with = { version = "2.3", features = ["macros"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
num_cpus = "1.16"
parking_lot = { version = "0.12", features = ["deadlock_detection"] }
anyhow = { version = "1.0", features = ["backtrace"] }
crossbeam-deque = { version = "0.8", features = ["crossbeam-utils"] }

# GPU Support (optional)
# Uncomment and enable the gpu feature to use GPU acceleration
# #[cfg(feature = "gpu")]
# opencl-sys = { version = "0.6.0", optional = true }
# #[cfg(feature = "gpu")]
# cuda = { version = "0.3.0", optional = true }

# Kubernetes Support
#[cfg(feature = "k8s")]
kube = { version = "0.62", optional = true, features = ["derive", "client"] }
#[cfg(feature = "k8s")]
k8s-openapi = { version = "0.16", optional = true }

# Benchmarking
criterion = { version = "0.5", optional = true }
pprof = { version = "0.12", optional = true, features = ["criterion", "flamegraph"] }

[features]
default = []
# HTTP client functionality is provided by the runtime crate
http = []
gpu = []
k8s = []
bench = ["criterion"]
profiling = ["pprof"]
metrics = []
# Enables quarantined legacy tests that target the soon-to-be-removed core::engine (Phase 1).
# Off by default so the standard build/CI is green; these tests do not yet compile.
legacy_tests = []

# NOTE: the example programs have been moved to `examples_legacy/` (not compiled). They target
# the pre-consolidation executor API and no longer build. They will be rewritten against the
# canonical engine in roadmap Phase 1. See `examples_legacy/README.md`.

[dev-dependencies]
tempfile = "3.3"
rstest = "0.17"
tokio-test = "0.4"
